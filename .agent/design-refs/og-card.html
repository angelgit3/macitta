<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #7C85E8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    border: 3px solid rgba(13,14,23,0.25); border-radius: 999px;
    padding: 8px 22px; font-size: 20px; font-weight: 900; color: #0D0E17;
    letter-spacing: -0.01em;
  }
  h1 {
    margin-top: 34px;
    font-size: 210px; font-weight: 900; letter-spacing: -0.055em;
    color: #0D0E17; line-height: 0.95;
  }
  h1 .dot { color: #E8B84B; }
  .tagline {
    margin-top: 30px; font-size: 34px; font-weight: 800; color: #0D0E17;
    letter-spacing: -0.02em;
  }
  .sub {
    margin-top: 14px; font-size: 22px; font-weight: 600; color: rgba(13,14,23,0.85);
  }
  .chip {
    position: absolute; display: inline-flex; align-items: center; gap: 8px;
    background: #0D0E17; color: #F0F1FF; border-radius: 999px;
    padding: 10px 20px; font-size: 18px; font-weight: 900;
    box-shadow: 0 14px 30px -10px rgba(13,14,23,0.55);
  }
  .chip svg { stroke: #6BCB8E; }
  .chip-a { top: 96px; right: 210px; transform: rotate(6deg); }
  .chip-b { bottom: 210px; left: 74px; transform: rotate(-5deg); }
  .wave { position: absolute; bottom: -2px; left: 0; width: 100%; height: 74px; display: block; }
</style>
</head>
<body>
  <div class="badge">Repetición espaciada · Offline-first</div>
  <h1>macitta<span class="dot">.</span></h1>
  <div class="tagline">Recuerda el inglés cuando de verdad lo necesitas.</div>
  <div class="sub">Vocabulario, lecturas y práctica TOEFL — incluso sin conexión.</div>

  <div class="chip chip-a">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
    TOEFL
  </div>
  <div class="chip chip-b">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA2F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    Sin conexión
  </div>

  <svg class="wave" viewBox="0 0 1440 74" preserveAspectRatio="none">
    <path d="M0 74 L0 38 Q 90 -8 180 38 T 360 38 T 540 38 T 720 38 T 900 38 T 1080 38 T 1260 38 T 1440 38 L 1440 74 Z" fill="#0D0E17"/>
  </svg>
</body>
</html>
